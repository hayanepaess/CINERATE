<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Cinema</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.9)), #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #1b1b1b;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .logo {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border: 2px dashed #e50914;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaa;
            text-align: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #bbb;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #fff;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #292929;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #e50914;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.5);
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b20710;
            transform: scale(1.02);
        }

        .rodape {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .logo {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="logo.png.jpg0," alt="Logo do cinema">
        </div>

        <h1>Entre em Contato</h1>

        <p class="descricao">
            Fale com nossa equipe do Cinerate.
        </p>

        <form>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto" required>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>
            </div>

            <button type="submit">Enviar mensagem</button>

        </form>

        <p class="rodape">
            © 2026 Cinema — Todos os direitos reservados.
        </p>

    </div>

</body>
</html>
